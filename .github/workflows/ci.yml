name: CHRONOS CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.1.1"
  # Dummy values — conftest.py overrides these; the DB layer is mocked in tests.
  POSTGRES_SERVER: localhost
  POSTGRES_USER: chronos_test
  POSTGRES_PASSWORD: chronos_test_password
  POSTGRES_DB: chronos_test_db
  POSTGRES_PORT: 5432

jobs:
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PySpark requires a JVM. openjdk-17-jdk installs to the path that
      # conftest.py expects: /usr/lib/jvm/java-17-openjdk-amd64
      - name: Install Java 17 (required by PySpark)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Install Dependencies
        run: poetry install

      - name: Linting (Ruff)
        run: |
          poetry run pip install ruff
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run Tests (Pytest)
        env:
          ENVIRONMENT: local
        run: poetry run pytest -v
