name: CHRONOS Continuous Deployment

on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: evidentedesarrollo
  REGION: us-central1
  REPO_NAME: chronos-repo
  SERVICE_NAME: chronos-api
  IMAGE_NAME: chronos-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build context is the repo root (.) so the Dockerfile can access chronos/
      - name: Build and Push Container
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          flags: |
            --memory=2Gi
            --cpu=1
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3
            --timeout=300
            --service-account=chronos-sa@evidentedesarrollo.iam.gserviceaccount.com

          # Production environment — no database, no MLflow server.
          # GCS credentials are provided by the --service-account flag above
          # (Workload Identity / ADC), so no key file is needed at runtime.
          env_vars: |
            ENVIRONMENT=production
            GCS_BUCKET_NAME=chronos-mlflow-artifacts-evidentedesarrollo
            GCS_MODEL_PREFIX=models/
            GOOGLE_CLOUD_PROJECT=evidentedesarrollo

      - name: Print Service URL
        run: |
          echo "CHRONOS API deployed successfully."
          echo "URL: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')"
